name: Build Mutagen APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make wrapper executable
        run: chmod +x gradlew

      # Gradle distribution download can fail with 504 on services.gradle.org,
      # so retry and fall back to a mirror.
      - name: Build debug APK
        run: |
          for attempt in 1 2 3; do
            echo "== attempt $attempt =="
            if ./gradlew assembleDebug --stacktrace --no-daemon; then exit 0; fi
            if [ "$attempt" = "2" ]; then
              echo "Switching Gradle download to mirror"
              sed -i 's#https\\://services.gradle.org/distributions#https\\://mirrors.cloud.tencent.com/gradle#' gradle/wrapper/gradle-wrapper.properties
            fi
            sleep 15
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mutagen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
