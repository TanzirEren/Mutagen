plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mutagen.lab'
    compileSdk 34

    defaultConfig {
        applicationId "com.mutagen.lab"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/INDEX.LIST',
                         'META-INF/MANIFEST.MF', 'about.html', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    // Smali / Baksmali engine (decompile + rebuild DEX on-device)
    implementation 'org.smali:baksmali:2.5.2'
    implementation 'org.smali:smali:2.5.2'
    // APK signer (v1 + v2) from the Android build tools
    implementation 'com.android.tools.build:apksig:8.1.4'
}
